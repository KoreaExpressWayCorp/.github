<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>PrivacyShield 불러오는 중</title>
<style>html,body{height:100%;margin:0;background:#06101c;color:#eef8ff;font-family:system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;text-align:center}.loading i{display:block;width:42px;height:42px;margin:0 auto 18px;border:3px solid #203348;border-top-color:#4ce0bd;border-radius:50%;animation:s .8s linear infinite}.loading p{color:#8da3b7;font-size:13px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="loading"><div><i></i><strong>PrivacyShield 준비 중</strong><p>브라우저 비식별화 엔진을 불러오고 있습니다.</p></div></div>
<script>
Promise.all([1,2,3,4,5].map(n=>fetch(`demo-${n}.txt?v=20260722`).then(r=>{if(!r.ok)throw new Error(`파일 ${n} 로드 실패`);return r.text()}))).then(parts=>{document.open();document.write(parts.join(''));document.close()}).catch(error=>{document.body.innerHTML=`<div class="loading"><div><strong>페이지를 불러오지 못했습니다.</strong><p>${error.message}</p><button onclick="location.reload()">다시 시도</button></div></div>`})
</script></body></html>
