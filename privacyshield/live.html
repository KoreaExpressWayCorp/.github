<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f">
<title>PrivacyShield 불러오는 중</title>
<style>html,body{height:100%;margin:0;background:#06101c;color:#eef8ff;font-family:system-ui,sans-serif}.loading{height:100%;display:grid;place-items:center;text-align:center;padding:24px}.loading i{display:block;width:42px;height:42px;margin:0 auto 18px;border:3px solid #203348;border-top-color:#4ce0bd;border-radius:50%;animation:s .8s linear infinite}.loading p{color:#8da3b7;font-size:13px}.loading button{margin-top:12px;padding:10px 14px;border:1px solid #203348;border-radius:8px;background:#4ce0bd;color:#05231c;font-weight:800}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body><div class="loading"><div><i></i><strong>PrivacyShield 준비 중</strong><p>브라우저 비식별화 엔진을 불러오고 있습니다.</p></div></div>
<script>
const parts=['live-1.b64','live-2.b64','live-3.b64','live-4.b64','live-5.b64','live-6-00.b64','live-6-01.b64','live-6-02.b64','live-7.b64','live-8.b64'];
Promise.all(parts.map(name=>fetch(`${name}?v=20260722-2`).then(r=>{if(!r.ok)throw new Error(`${name} 로드 실패`);return r.text()}))).then(chunks=>{const bin=atob(chunks.join('').replace(/\s+/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const html=new TextDecoder('utf-8').decode(bytes);document.open();document.write(html);document.close()}).catch(error=>{document.body.innerHTML=`<div class="loading"><div><strong>페이지를 불러오지 못했습니다.</strong><p>${error.message}</p><button onclick="location.reload()">다시 시도</button></div></div>`})
</script></body></html>
